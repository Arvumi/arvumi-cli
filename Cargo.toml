[package]
name = "arvumi-cli"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
description = "Command-line client for the Arvumi deployment platform"
license = "MIT"
homepage = "https://arvumi.com"
repository = "https://github.com/Arvumi/arvumi-cli"
readme = "README.md"
keywords = ["arvumi", "deployment", "serverless", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE"]

[[bin]]
name = "arvumi"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }
clap = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { workspace = true }
eyre = { workspace = true }
dirs = "5"
dialoguer = "0.11"
open = "5"

futures-util = { workspace = true }
chrono = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
libc = { workspace = true }

[dev-dependencies]
tempfile = "3"
